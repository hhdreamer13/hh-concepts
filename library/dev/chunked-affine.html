<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chunked Affine · dev · hh-concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preload" href="../../fonts/dm-serif-display.woff2"          as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/plex-sans-arabic.woff2"          as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/plex-sans-arabic-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/plex-mono.woff2"                 as="font" type="font/woff2" crossorigin>

<style>
@font-face {
  font-family: 'DM Serif Display';
  src: url('../../fonts/dm-serif-display.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('../../fonts/plex-sans-arabic.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('../../fonts/plex-sans-arabic-semibold.woff2') format('woff2');
  font-weight: 600; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Mono';
  src: url('../../fonts/plex-mono.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}

:root {
  --bg:        #ffffff;
  --bg-soft:   #f7f8fa;
  --bg-card:   #eef0f4;
  --bg-deep:   #f0f2f6;
  --line:      #c8cdd6;
  --line-soft: #dde0e6;
  --fg:        #1a1d24;
  --fg-soft:   #4a5568;
  --fg-mute:   #7a8499;

  --accent:    #1a8765;   /* teal — pos / success */
  --danger:    #c44545;   /* red — fail / OOM */
  --warn:      #a07d2a;   /* amber — suspect / grid */
  --blue:      #2c7eb5;   /* blue — neutral data */
  --purple:    #6e44a8;   /* purple — mechanism / model */
  --voxel:     #b8c0cc;   /* gray — wireframe */

  --serif: 'DM Serif Display', Georgia, serif;
  --mono:  'IBM Plex Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans:  'IBM Plex Sans Arabic', ui-sans-serif, -apple-system, sans-serif;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-fast: 160ms;
  --dur-base: 220ms;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 13px;
}

.app { display: grid; grid-template-rows: 48px minmax(0, 1fr) 144px 48px; height: 100vh; }

/* ===================== header ===================== */
header {
  display: flex; align-items: center; gap: 28px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-soft);
  font-size: 13px;
}
header .brand {
  font-family: var(--serif);
  font-size: 19px;
  letter-spacing: 0.005em;
  text-decoration: none;
  color: var(--fg);
  transition: color var(--dur-fast) var(--ease-out);
}
header a.brand:hover { color: var(--accent); }
header .brand .sub { color: var(--fg-mute); font-weight: 400; margin-left: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; }
header .pill {
  font-family: var(--mono); font-size: 12px;
  color: var(--fg-soft);
  padding: 4px 11px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--bg-card);
}
header .pill .num { color: var(--accent); font-weight: 600; }
header .meta {
  margin-left: auto;
  font-family: var(--mono); font-size: 12px; color: var(--fg-soft);
  display: flex; align-items: baseline; gap: 18px;
}
header .meta .item { display: flex; align-items: baseline; gap: 6px; }
header .meta .item .k { color: var(--fg-mute); }
header .meta .item .v { color: var(--fg); font-weight: 500; }
header .meta .item .v.over   { color: var(--danger); }
header .meta .item .v.warn   { color: var(--warn); }
header .meta .item .v.pos    { color: var(--accent); }
header .meta .item .v.purple { color: var(--purple); }

/* ===================== stage ===================== */
.stage-wrap {
  position: relative;
  background: radial-gradient(ellipse at center, var(--bg-soft) 0%, var(--bg) 80%);
  overflow: hidden;
  min-height: 0;
}
.stage-svg {
  display: block;
  width: 100%;
  height: 100%;
}
.stage-svg text         { font-family: var(--mono); }
.stage-svg .label         { font-family: var(--mono); fill: var(--fg-soft); font-size: 11px; }
.stage-svg .label.title   { font-family: var(--sans); font-weight: 600; fill: var(--fg); font-size: 22px; letter-spacing: -0.005em; }
.stage-svg .label.eyebrow { font-family: var(--mono); fill: var(--fg-mute); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; }
.stage-svg .label.body    { font-family: var(--sans); fill: var(--fg-soft); font-size: 12.5px; }
.stage-svg .label.dim     { fill: var(--fg-mute); font-size: 10.5px; }
.stage-svg .axis          { stroke: var(--line); stroke-width: 1; }

/* ===================== strip ===================== */
.strip {
  display: grid;
  grid-template-columns: 1fr 1fr 0.9fr;
  border-top: 1px solid var(--line);
  background: var(--bg-soft);
  min-height: 0;
}
.strip .cell {
  padding: 14px 20px;
  border-right: 1px solid var(--line-soft);
  overflow: hidden;
  display: flex; flex-direction: column;
  min-height: 0;
}
.strip .cell:last-child { border-right: none; }
.strip .cell .heading {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--fg-mute);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.strip .cell .body {
  flex: 1; overflow-y: auto; min-height: 0;
}

.code {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-deep); border: 1px solid var(--line-soft);
  border-left: 2px solid var(--accent);
  padding: 8px 12px; border-radius: 2px;
  color: var(--fg-soft);
  white-space: pre; overflow-x: auto; line-height: 1.6;
}
.code.warn   { border-left-color: var(--warn); }
.code.danger { border-left-color: var(--danger); }
.code .k { color: var(--purple); }
.code .b { color: var(--blue); }
.code .s { color: var(--accent); }
.code .n { color: var(--warn); }
.code .c { color: var(--fg-mute); }
.code .h { color: var(--fg); font-weight: 600; }
.code .r { color: var(--danger); }

.note { font-family: var(--sans); font-size: 13px; color: var(--fg-soft); line-height: 1.55; }
.note + .note { margin-top: 8px; }
.note strong { color: var(--fg); font-weight: 600; }
.note em { color: var(--accent); font-style: normal; }
.note code {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-deep); border: 1px solid var(--line-soft);
  padding: 0 5px; border-radius: 2px; color: var(--fg);
}

/* ===================== footer ===================== */
footer {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-top: 1px solid var(--line);
  background: var(--bg-soft);
  overflow: hidden;
}
.btn {
  background: transparent; color: var(--fg-soft);
  border: 1px solid var(--line); border-radius: 3px;
  padding: 5px 12px; font-family: var(--mono); font-size: 13px; cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.steps { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
.steps::-webkit-scrollbar { height: 2px; }
.steps::-webkit-scrollbar-thumb { background: var(--line); }
.stepbtn {
  flex: 1; min-width: 90px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--fg-mute); background: transparent;
  border: 1px solid transparent; border-radius: 3px;
  padding: 5px 10px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  letter-spacing: 0.02em;
  text-align: left;
}
.stepbtn .n { color: var(--fg-mute); margin-right: 8px; font-size: 9.5px; opacity: 0.55; }
.stepbtn:hover { color: var(--fg-soft); }
.stepbtn.active { color: var(--accent); border-color: var(--accent); }
.stepbtn.active .n { color: var(--accent); opacity: 0.6; }
.stepbtn.passed { color: var(--fg-soft); }
.kbd { font-family: var(--mono); font-size: 10px; color: var(--fg-mute); flex-shrink: 0; }
.kbd kbd { background: var(--bg-card); border: 1px solid var(--line); padding: 1px 4px; border-radius: 2px; }
</style>
</head>
<body>

<div class="app">

  <header>
    <a class="brand" href="../../index.html" title="back to library">chunked_affine<span class="sub">a memory bug, and the slab fix</span></a>
    <div class="pill">step <span class="num" id="step-num">1</span> / <span id="step-total">5</span></div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="stage-wrap" id="stage-wrap">
    <svg class="stage-svg" id="stage" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a8765"/>
        </marker>
        <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8499"/>
        </marker>
        <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07d2a"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="strip">
    <div class="cell">
      <div class="heading" id="cell-heading-1">operation</div>
      <div class="body"><div class="note" id="cell-concept"></div></div>
    </div>
    <div class="cell">
      <div class="heading" id="cell-heading-2">numbers</div>
      <div class="body"><div id="cell-formula"></div></div>
    </div>
    <div class="cell">
      <div class="heading" id="cell-heading-3">notes</div>
      <div class="body"><div class="note" id="cell-notes"></div></div>
    </div>
  </div>

  <footer>
    <button class="btn" id="prev-btn">←</button>
    <div class="steps" id="steps"></div>
    <button class="btn" id="next-btn">→</button>
    <span class="kbd"><kbd>←</kbd><kbd>→</kbd></span>
  </footer>

</div>

<script>
/* ===============================================================
   helpers
   =============================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
let VW = 1200, VH = 600;

const $ = id => document.getElementById(id);
const stage = $('stage');

const C = {
  fg:       '#1a1d24',
  fgSoft:   '#4a5568',
  fgMute:   '#7a8499',
  line:     '#c8cdd6',
  lineSoft: '#dde0e6',
  bgDeep:   '#f0f2f6',
  bgCard:   '#eef0f4',
  bgSoft:   '#f7f8fa',
  bg:       '#ffffff',
  accent:   '#1a8765',
  danger:   '#c44545',
  warn:     '#a07d2a',
  blue:     '#2c7eb5',
  purple:   '#6e44a8',
  voxel:    '#b8c0cc',
};

function fitStage() {
  const wrap = $('stage-wrap');
  const w = wrap.clientWidth || 1200;
  const h = wrap.clientHeight || 600;
  VW = Math.max(820, w);
  VH = Math.max(380, h);
  stage.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
}

function svg(name, attrs = {}, parent = stage) {
  const el = document.createElementNS(SVGNS, name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent.appendChild(el);
  return el;
}

function clearStage() {
  [...stage.children].forEach(c => { if (c.tagName.toLowerCase() !== 'defs') c.remove(); });
}

function txt(x, y, str, opts = {}, parent = stage) {
  const attrs = {
    x, y,
    'text-anchor':       opts.anchor   || 'start',
    'dominant-baseline': opts.baseline || 'auto',
    fill:                opts.fill     || C.fgSoft,
  };
  if (opts.cls)      attrs.class = opts.cls;
  if (opts.font)     attrs['font-family'] = opts.font;
  if (opts.size)     attrs['font-size']   = opts.size;
  if (opts.italic)   attrs['font-style']  = 'italic';
  if (opts.weight)   attrs['font-weight'] = opts.weight;
  if (opts.tracking) attrs['letter-spacing'] = opts.tracking;
  const t = svg('text', attrs, parent);
  t.textContent = str;
  return t;
}

function lineEl(x1, y1, x2, y2, opts = {}, parent = stage) {
  return svg('line', {
    x1, y1, x2, y2,
    stroke: opts.stroke || C.fgMute,
    'stroke-width': opts.w || 1,
    'stroke-dasharray': opts.dash || 'none',
    'marker-end': opts.arrow ? `url(#arrow${opts.arrow === 'mute' ? '-mute' : opts.arrow === 'warn' ? '-warn' : ''})` : '',
    opacity: opts.opacity ?? 1,
  }, parent);
}

function setMeta(items) {
  const el = $('meta');
  el.innerHTML = '';
  if (!items || !items.length) return;
  items.forEach(it => {
    const w = document.createElement('div');
    w.className = 'item';
    w.innerHTML = `<span class="k">${it.k}:</span><span class="v ${it.tone || ''}">${it.v}</span>`;
    el.appendChild(w);
  });
}

function setHeadings(h1, h2, h3) {
  $('cell-heading-1').textContent = h1 || 'operation';
  $('cell-heading-2').textContent = h2 || 'numbers';
  $('cell-heading-3').textContent = h3 || 'notes';
}

/* ===============================================================
   isometric box with face shading (final-light style)
   =============================================================== */
function box3d(x, y, w, h, dx, dy, opts = {}, parent = stage) {
  const fill = opts.color || C.purple;
  const stroke = opts.stroke || fill;
  const sw = opts.strokeWidth ?? 1.2;
  const op = opts.opacity ?? 1;
  const fA = opts.frontOp ?? 0.32;
  const fB = opts.topOp   ?? 0.55;
  const fC = opts.rightOp ?? 0.20;
  const g = svg('g', { opacity: op }, parent);
  /* back face — under right + top, dim */
  svg('path', {
    d: `M ${x+dx} ${y-dy} L ${x+dx+w} ${y-dy} L ${x+dx+w} ${y-dy+h} L ${x+dx} ${y-dy+h} Z`,
    fill, 'fill-opacity': fA * 0.6, stroke, 'stroke-width': sw * 0.5, 'stroke-opacity': 0.4,
  }, g);
  /* top — brightest */
  svg('path', {
    d: `M ${x} ${y} L ${x+dx} ${y-dy} L ${x+dx+w} ${y-dy} L ${x+w} ${y} Z`,
    fill, 'fill-opacity': fB, stroke, 'stroke-width': sw,
  }, g);
  /* right — darker */
  svg('path', {
    d: `M ${x+w} ${y} L ${x+dx+w} ${y-dy} L ${x+dx+w} ${y-dy+h} L ${x+w} ${y+h} Z`,
    fill, 'fill-opacity': fC, stroke, 'stroke-width': sw,
  }, g);
  /* front — mid */
  svg('path', {
    d: `M ${x} ${y} L ${x+w} ${y} L ${x+w} ${y+h} L ${x} ${y+h} Z`,
    fill, 'fill-opacity': fA, stroke, 'stroke-width': sw,
  }, g);
  return g;
}

/* tall isometric volume with optional Z-axis slab fills */
function drawVolume3D({ cx, cy, vx, vy, vz, scale, color = C.voxel, slabs = [], parent = stage }) {
  const ax = vx * scale;
  const ay = vy * scale;
  const az = vz * scale;
  const dxF = 0.6 * Math.cos(Math.PI / 6);
  const dyF = 0.6 * Math.sin(Math.PI / 6);
  const totalW = ax + az * dxF;
  const totalH = ay + az * dyF;
  const x0 = cx - totalW / 2;
  const y0 = cy - totalH / 2 + az * dyF;

  /* outer wireframe — neutral, faint fills */
  box3d(x0, y0, ax, ay, az * dxF, az * dyF, {
    color, strokeWidth: 1, frontOp: 0.06, topOp: 0.12, rightOp: 0.04, opacity: 0.95,
  }, parent);

  /* slabs */
  slabs.forEach(slab => {
    const slabAz = (slab.z1 - slab.z0) * scale;
    const slabZ0 = slab.z0 * scale;
    const slabX  = x0 + slabZ0 * dxF;
    const slabY  = y0 - slabZ0 * dyF;
    box3d(slabX, slabY, ax, ay, slabAz * dxF, slabAz * dyF, {
      color: slab.color, strokeWidth: 1.4,
      frontOp: 0.32, topOp: 0.55, rightOp: 0.20,
      opacity: slab.opacity ?? 1,
    }, parent);
  });
}

/* ===============================================================
   memory bar — bold, white surface, budget rule, overflow
   =============================================================== */
function drawMemoryBar({ x, y, width, totalGB, segments, height = 38, parent = stage, label = 'GPU MEMORY · 16 GB BUDGET' }) {
  const g = svg('g', {}, parent);
  const pxPerGB = width / totalGB;
  const usedGB = segments.reduce((s, seg) => s + seg.gb, 0);
  const overflowing = usedGB > totalGB;

  txt(x, y - 10, label, { size: 10, fill: C.fgMute }, g);

  let cursor = x;
  segments.forEach((seg, i) => {
    const w = seg.gb * pxPerGB;
    const cap = Math.min(cursor + w, x + width) - cursor;
    if (cap > 0.5) {
      svg('rect', { x: cursor, y, width: cap, height, fill: seg.color, opacity: 0.92 }, g);
      if (i > 0) svg('line', { x1: cursor, y1: y, x2: cursor, y2: y + height, stroke: '#ffffff', 'stroke-width': 1, opacity: 0.95 }, g);
    }
    /* overflow chunk — sits past the budget line, in danger color */
    const over = cursor + w - (x + width);
    if (over > 0.5) {
      svg('rect', {
        x: x + width, y: y - 4, width: over, height: height + 8,
        fill: C.danger, opacity: 0.92, stroke: C.danger, 'stroke-width': 1,
      }, g);
    }
    if (cap > 80) {
      txt(cursor + cap/2, y + height/2 - 2, seg.label, {
        anchor: 'middle', baseline: 'middle', size: 11, fill: '#ffffff', weight: 600, font: 'IBM Plex Mono, ui-monospace, monospace',
      }, g);
      txt(cursor + cap/2, y + height/2 + 13, seg.gb.toFixed(seg.gb < 1 ? 2 : 1) + ' GB', {
        anchor: 'middle', baseline: 'middle', size: 10, fill: '#ffffff',
      }, g).setAttribute('opacity', '0.78');
    }
    cursor += w;
  });

  if (usedGB < totalGB) {
    svg('rect', {
      x: cursor, y, width: x + width - cursor, height,
      fill: C.bg, stroke: C.lineSoft, 'stroke-width': 0.8,
    }, g);
    if (x + width - cursor > 60) {
      txt((cursor + x + width)/2, y + height/2, 'free', {
        anchor: 'middle', baseline: 'middle', size: 11, fill: C.fgMute,
      }, g);
    }
  }

  /* budget rule */
  svg('line', {
    x1: x + width, y1: y - 6, x2: x + width, y2: y + height + 6,
    stroke: overflowing ? C.danger : C.fg, 'stroke-width': 1.6,
  }, g);
  txt(x + width + 8, y + height/2 + 4, '16 GB', {
    size: 11, fill: overflowing ? C.danger : C.fgMute,
  }, g);

  /* tick marks */
  for (let gb = 0; gb <= totalGB; gb += 4) {
    const tx = x + gb * pxPerGB;
    svg('line', { x1: tx, y1: y + height, x2: tx, y2: y + height + 4, stroke: C.fgMute, 'stroke-width': 0.6 }, g);
    txt(tx, y + height + 17, String(gb), { anchor: 'middle', size: 10, fill: C.fgMute }, g);
  }
  return g;
}

/* ===============================================================
   stage code panel
   =============================================================== */
function drawCodePanel({ x, y, width, height, lines, highlightedLine = -1, label = '', parent = stage }) {
  const g = svg('g', {}, parent);
  svg('rect', { x, y, width, height, fill: C.bgDeep, stroke: C.lineSoft, 'stroke-width': 1, rx: 3 }, g);
  if (label) txt(x + 14, y + 18, label, { size: 10, fill: C.fgMute }, g);
  const lh = 19;
  const top = label ? y + 38 : y + 20;
  lines.forEach((ln, i) => {
    if (i === highlightedLine) {
      svg('rect', {
        x: x + 4, y: top + i * lh - 13, width: width - 8, height: lh,
        fill: C.warn, opacity: 0.12,
      }, g);
    }
    txt(x + 14, top + i * lh, ln.text, {
      size: 12, fill: ln.color || C.fgSoft,
      weight: ln.bold ? 600 : 400, font: 'IBM Plex Mono, ui-monospace, monospace',
    }, g);
  });
  return g;
}

/* ===============================================================
   animation
   =============================================================== */
let animFrame = null;
let animStart = 0;

function startAnim(periodMs, frameFn) {
  stopAnim();
  animStart = performance.now();
  function tick() {
    const t = (performance.now() - animStart) % periodMs;
    frameFn(t);
    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

function stopAnim() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
}

function reduceMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

const smooth = p => p * p * (3 - 2 * p);

/* ===============================================================
   stages
   =============================================================== */

const stages = [

/* ============================================================ 1 — setup */
{
  short: '1. setup',
  meta: [
    { k: 'volume', v: '512 × 512 × 2400' },
    { k: 'used',   v: '9 GB / 16 GB', tone: 'pos' },

/* ===============================================================
   step-3 + step-4 frame state
   =============================================================== */

function step3Segments(t) {
  const baseline = [
    { label: 'model',       gb: 3, color: C.purple },
    { label: 'activations', gb: 4, color: C.blue },
    { label: 'input',       gb: 2, color: C.accent },
  ];
  const segs = [...baseline];
  const t1 = 1500, t2 = t1 + 2000, t3 = t2 + 1000;
  if (t > t1) {
    const p = Math.min(1, (t - t1) / (t2 - t1));
    if (smooth(p) > 0.005) segs.push({ label: 'F.affine_grid', gb: 7 * smooth(p), color: C.warn });
  }
  if (t > t2) {
    const p = Math.min(1, (t - t2) / (t3 - t2));
    if (smooth(p) > 0.005) segs.push({ label: 'grid_sample', gb: 2.4 * smooth(p), color: C.danger });
  }
  return segs;
}

const SLABS_VIS = 7;
const REAL_CHUNKS = 28;
const SLAB_MS = 1100;
const PRE_MS = 800;
const HOLD_MS = 1500;
const STEP4_LOOP_MS = PRE_MS + SLABS_VIS * SLAB_MS + HOLD_MS;

function step4State(t) {
  if (t < PRE_MS) {
    const p = t / PRE_MS;
    return { outputAlloc: 2.4 * smooth(p), slabIdx: -1, slabPhase: 0, slabsCompleted: 0, codeLine: 0 };
  }
  const after = t - PRE_MS;
  const idx = Math.floor(after / SLAB_MS);
  if (idx >= SLABS_VIS) {
    return { outputAlloc: 2.4, slabIdx: SLABS_VIS, slabPhase: 1, slabsCompleted: SLABS_VIS, codeLine: -1 };
  }
  const local = (after - idx * SLAB_MS) / SLAB_MS;
  let codeLine;
  if      (local < 0.25) codeLine = 3;
  else if (local < 0.70) codeLine = 4;
  else if (local < 0.85) codeLine = 5;
  else                   codeLine = 6;
  return { outputAlloc: 2.4, slabIdx: idx, slabPhase: local, slabsCompleted: idx, codeLine };
}

/* ===============================================================
   render loop
   =============================================================== */
let current = 0;

function buildSteps() {
  const stepsEl = $('steps');
  stepsEl.innerHTML = '';
  stages.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'stepbtn';
    /* strip leading "1. " etc. from short, replace with formatted "01" prefix */
    const cleanLabel = s.short.replace(/^\d+\.\s*/, '');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>${cleanLabel}`;
    b.onclick = () => render(i);
    stepsEl.appendChild(b);
  });
  $('step-total').textContent = stages.length;
}

function render(idx) {
  stopAnim();
  current = idx;
  const s = stages[idx];

  $('step-num').textContent = idx + 1;
  document.querySelectorAll('.stepbtn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
    b.classList.toggle('passed', i < idx);
  });

  clearStage();
  if (s.render) s.render();

  if (s.headings) setHeadings(...s.headings);
  if (s.concept) $('cell-concept').innerHTML = s.concept;
  if (s.formula) $('cell-formula').innerHTML = s.formula;
  if (s.notes)   $('cell-notes').innerHTML   = s.notes;
  setMeta(s.meta || []);

  $('prev-btn').disabled = idx === 0;
  $('next-btn').disabled = idx === stages.length - 1;
}

buildSteps();
$('prev-btn').onclick = () => current > 0                 && render(current - 1);
$('next-btn').onclick = () => current < stages.length - 1 && render(current + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft'  && current > 0)                  render(current - 1);
  if (e.key === 'ArrowRight' && current < stages.length - 1)  render(current + 1);
});

const ro = new ResizeObserver(() => {
  fitStage();
  if (stages.length) render(current);
});
ro.observe($('stage-wrap'));

requestAnimationFrame(() => requestAnimationFrame(() => {
  fitStage();
  render(0);
}));
</script>

</body>
