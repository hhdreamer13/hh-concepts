<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Concept · category · hh-concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preload" href="../fonts/dm-serif-display.woff2"          as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/plex-sans-arabic.woff2"          as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/plex-sans-arabic-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/plex-mono.woff2"                 as="font" type="font/woff2" crossorigin>

<style>
@font-face {
  font-family: 'DM Serif Display';
  src: url('../fonts/dm-serif-display.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('../fonts/plex-sans-arabic.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans Arabic';
  src: url('../fonts/plex-sans-arabic-semibold.woff2') format('woff2');
  font-weight: 600; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Mono';
  src: url('../fonts/plex-mono.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}

:root {
  /* paper — cool slate */
  --bg:        #f4f6fa;
  --surface:   #fafbfd;   /* stage — half-step lighter than bg, never harsh white */
  --panel:     #eceff5;   /* header / strip / footer */

  /* ink — four steps, cool */
  --ink:       #1a1d24;
  --ink-2:     #4a5568;
  --ink-3:     #7a8499;
  --ink-4:     #b0b8c4;

  /* hairlines */
  --line:      #dde1e9;
  --line-2:    #c8cdd6;

  /* one accent */
  --accent:    #2c5dbb;
  --accent-xl: #e7eef9;

  /* semantic — for SVG renders only, not chrome */
  --pos:       #1a8765;   /* good / kept / pass */
  --neg:       #c44545;   /* bad / rejected / fail */
  --warn:      #a07d2a;   /* attention / live now */
  --info:      #2c7eb5;   /* neutral data / axis callouts */

  /* serif — display face for the brand identity (upright). */
  --font-serif: 'DM Serif Display', Georgia, serif;
  /* sans — IBM Plex Sans Arabic handles both Latin and Arabic/Persian natively
     (designed by Bahman Eslami; one designer's hand on both scripts). 400 + 600 weights. */
  --font-sans:  'IBM Plex Sans Arabic', ui-sans-serif, -apple-system, sans-serif;
  --font-mono:  'IBM Plex Mono', ui-monospace, 'Menlo', monospace;

  --ease-out:  cubic-bezier(0.23, 1, 0.32, 1);
  --dur-fast:  160ms;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

.app { display: grid; grid-template-rows: 48px minmax(0, 1fr) 144px 48px; height: 100vh; }

/* ===================== header ===================== */
header {
  display: flex; align-items: center; gap: 28px;
  padding: 0 24px;
  border-bottom: 0.5px solid var(--line);
  background: var(--panel);
}
header .brand {
  font-family: var(--font-serif);
  font-size: 19px;
  color: var(--ink);
  letter-spacing: 0.005em;
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
header a.brand:hover { color: var(--accent); }
header .brand .sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-left: 12px;
  letter-spacing: 0.02em;
}
header .pill {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-2);
  padding: 3px 10px;
  border: 0.5px solid var(--line-2);
  border-radius: 3px;
  background: var(--bg);
  letter-spacing: 0.02em;
}
header .pill .num { color: var(--accent); font-weight: 500; }

header .meta {
  margin-left: auto;
  display: flex; align-items: baseline; gap: 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.02em;
}
header .meta .item { display: flex; align-items: baseline; gap: 6px; }
header .meta .item .k { color: var(--ink-3); }
header .meta .item .v { color: var(--ink); font-weight: 500; }
header .meta .item .v.accent { color: var(--accent); }
header .meta .item .v.warn   { color: var(--warn); }
header .meta .item .v.neg    { color: var(--neg); }
header .meta .item .v.pos    { color: var(--pos); }

/* ===================== stage ===================== */
.stage-wrap {
  position: relative;
  background: var(--surface);
  overflow: hidden;
  min-height: 0;
}
.stage-svg {
  display: block;
  width: 100%;
  height: 100%;
  color: var(--accent); /* drives currentColor in arrow markers */
}
.stage-svg text { font-family: var(--font-mono); }

.stage-svg .label         { fill: var(--ink-2); font-size: 11px; font-family: var(--font-mono); }
.stage-svg .label.title   { font-family: var(--font-sans); font-weight: 600; fill: var(--ink); font-size: 22px; letter-spacing: -0.005em; }
.stage-svg .label.eyebrow { font-family: var(--font-mono); fill: var(--ink-3); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; }
.stage-svg .label.body    { font-family: var(--font-sans); fill: var(--ink-2); font-size: 12.5px; }
.stage-svg .label.dim     { fill: var(--ink-3); font-size: 10px; }
.stage-svg .label.faint   { fill: var(--ink-4); font-size: 10px; }
.stage-svg .label.accent  { fill: var(--accent); }
.stage-svg .axis          { stroke: var(--line-2); stroke-width: 0.5; }

.stage-svg .arrow      { color: var(--accent); stroke: var(--accent); fill: none; stroke-width: 1; }
.stage-svg .arrow.mute { color: var(--ink-3); stroke: var(--ink-3); }
.stage-svg .arrow.neg  { color: var(--neg);   stroke: var(--neg); }

/* opt-in slider overlay — populated via setOverlay({...}) per stage */
.stage-overlay {
  position: absolute;
  bottom: 14px; left: 50%; transform: translateX(-50%);
  display: none;
  align-items: center; gap: 14px;
  background: var(--panel);
  border: 0.5px solid var(--line-2);
  border-radius: 4px;
  padding: 7px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-2);
}
.stage-overlay.on { display: flex; }
.stage-overlay label { color: var(--ink-3); }
.stage-overlay .nval { color: var(--accent); min-width: 26px; text-align: right; font-weight: 500; }
.stage-overlay input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 200px; height: 2px;
  background: var(--line-2); border-radius: 1px;
  outline: none;
}
.stage-overlay input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px;
  background: var(--accent); border-radius: 50%;
  cursor: pointer;
}
.stage-overlay input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px;
  background: var(--accent); border-radius: 50%;
  border: none; cursor: pointer;
}

/* ===================== strip ===================== */
.strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  border-top: 0.5px solid var(--line);
  background: var(--panel);
  min-height: 0;
}
.strip .cell {
  padding: 14px 22px;
  border-right: 0.5px solid var(--line);
  overflow: hidden;
  display: flex; flex-direction: column;
  min-height: 0;
}
.strip .cell:last-child { border-right: none; }
.strip .cell .heading {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.strip .cell .body { flex: 1; overflow-y: auto; min-height: 0; }
.strip .cell .body::-webkit-scrollbar { width: 3px; }
.strip .cell .body::-webkit-scrollbar-thumb { background: var(--line-2); }

.note { font-family: var(--font-sans); font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.note + .note { margin-top: 8px; }
.note strong { color: var(--ink); font-weight: 600; }
.note em { font-style: normal; color: var(--accent); }
.note code {
  background: var(--bg);
  border: 0.5px solid var(--line);
  padding: 0 5px;
  border-radius: 2px;
  font-size: 11px;
  color: var(--ink);
}

.code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: transparent;
  border-left: 1.5px solid var(--accent);
  padding: 2px 0 2px 12px;
  color: var(--ink-2);
  white-space: pre;
  overflow-x: auto;
  line-height: 1.7;
}
.code .k { color: var(--accent); }
.code .s { color: var(--pos); }
.code .n { color: var(--warn); }
.code .c { color: var(--ink-3); font-style: italic; }
.code .f { color: var(--info); }

.formula { font-family: var(--font-mono); font-size: 12px; color: var(--ink); line-height: 1.75; }
.formula .row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: baseline; }
.formula .row .k { color: var(--ink-3); font-size: 10.5px; }
.formula .eq { color: var(--accent); padding: 2px 0 6px; }

/* ===================== footer ===================== */
footer {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-top: 0.5px solid var(--line);
  background: var(--panel);
}
.btn {
  background: transparent;
  color: var(--ink-2);
  border: 0.5px solid var(--line-2);
  border-radius: 3px;
  padding: 4px 11px;
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.steps { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
.steps::-webkit-scrollbar { height: 2px; }
.steps::-webkit-scrollbar-thumb { background: var(--line-2); }

.stepbtn {
  flex: 1; min-width: 80px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  background: transparent;
  border: 0.5px solid transparent;
  border-radius: 3px;
  padding: 4px 10px;
  cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  letter-spacing: 0.02em;
  text-align: left;
}
.stepbtn .n { color: var(--ink-4); margin-right: 8px; font-size: 9.5px; }
.stepbtn:hover  { color: var(--ink-2); }
.stepbtn.passed { color: var(--ink-2); }
.stepbtn.active { color: var(--accent); border-color: var(--accent); }
.stepbtn.active .n { color: var(--accent); opacity: 0.55; }

.kbd { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); flex-shrink: 0; }
.kbd kbd {
  background: var(--bg);
  border: 0.5px solid var(--line-2);
  padding: 1px 5px;
  border-radius: 2px;
  font-family: var(--font-mono);
}
</style>
</head>
<body>

<div class="app">

  <header>
    <a class="brand" href="../../index.html" title="back to library">concept_name<span class="sub">subtitle goes here</span></a>
    <div class="pill">step <span class="num" id="step-num">1</span> / <span id="step-total">1</span></div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="stage-wrap" id="stage-wrap">
    <svg class="stage-svg" id="stage" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- arrow markers use currentColor — drives off CSS so palette swaps cleanly -->
        <marker id="arrow"      viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
      </defs>
    </svg>
    <div class="stage-overlay" id="stage-overlay">
      <label id="overlay-label">value</label>
      <input type="range" id="overlay-slider" min="1" max="20" value="3" step="1">
      <span class="nval" id="overlay-val">3</span>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <footer>
    <button class="btn" id="prev-btn">←</button>
    <div class="steps" id="steps"></div>
    <button class="btn" id="next-btn">→</button>
    <span class="kbd"><kbd>←</kbd><kbd>→</kbd></span>
  </footer>

</div>

<script>
/* ===============================================================
   hh-concepts template — read this top to bottom before authoring.

   STAGE SHAPE
   -----------
   Each entry in `stages` defines one step. Available fields:

     short   : string  — step-tab label (required)
     title   : string  — optional, currently unused in chrome
     cells   : [{ heading, html }]  — strip cells, render in order, any count
     meta    : [{ k, v, tone? }]    — header meta items; tone: 'accent'|'warn'|'pos'|'neg'
     overlay : { label, min, max, value, step, onChange } | null  — opt-in slider
     setup() : function — build SVG once when the stage activates
     tick(t) : function — optional rAF loop, t = seconds since setup(); auto-stops on stage change
     cleanup(): function — optional, fires before leaving the stage

   HELPERS (available inside setup / tick)
   ---------------------------------------
   svg(tag, attrs, parent?)         create an SVG element
   txt(x, y, str, opts?, parent?)   text — opts: cls, anchor, baseline, fill, font, size, weight, italic, tracking
   line(x1,y1,x2,y2, opts?, parent?) line — opts: stroke, w, dash, arrow:'on'|'mute'|'neg'
   rect(x,y,w,h, opts?, parent?)    rect — opts: fill, stroke, w, rx, dash
   box3d(x,y,w,h,dx,dy, opts?)      isometric volume helper
   clearStage()                     wipe stage, keep <defs>
   setMeta(items)                   header meta slot
   setOverlay(cfg)                  show slider; pass null to hide
   VW, VH                           current viewBox dims (auto-resize)
   C                                color tokens (C.accent, C.ink, C.pos, …)

   TYPOGRAPHY (editorial hierarchy — use classes via cls: ...)
   -----------------------------------------------------------
   cls: 'label eyebrow' — small uppercase tracked mono "STEP 03 · CATEGORY" overline
   cls: 'label title'   — Plex Sans Arabic SemiBold, the working stage headline
   cls: 'label body'    — Plex Sans Arabic regular, subtitle / lede / body text
   cls: 'label'         — default mono label (axis ticks, callouts, generic labels)

   FONT ROLES (when not using classes)
   -----------------------------------
   --font-serif (DM Serif Display, upright) — brand identity only. Display face, ~19–28px range.
   --font-sans  (Plex Sans Arabic 400/600) — body prose, stage subtitles, anything readable.
                Handles Latin and Persian/Arabic in one font (Bahman Eslami).
   --font-mono  (Plex Mono) — code, formulas, axis ticks, technical labels, eyebrows.
   =============================================================== */

const SVGNS = 'http://www.w3.org/2000/svg';
let VW = 1200, VH = 600;

const $ = id => document.getElementById(id);
const stage = $('stage');

const C = {
  ink:    '#1a1d24',
  ink2:   '#4a5568',
  ink3:   '#7a8499',
  ink4:   '#b0b8c4',
  line:   '#dde1e9',
  line2:  '#c8cdd6',
  accent: '#2c5dbb',
  pos:    '#1a8765',
  neg:    '#c44545',
  warn:   '#a07d2a',
  info:   '#2c7eb5',
};

function fitStage() {
  const wrap = $('stage-wrap');
  const w = wrap.clientWidth || 1200;
  const h = wrap.clientHeight || 600;
  VW = Math.max(820, w);
  VH = Math.max(380, h);
  stage.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
}

function svg(name, attrs = {}, parent = stage) {
  const el = document.createElementNS(SVGNS, name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent.appendChild(el);
  return el;
}

function clearStage() {
  [...stage.children].forEach(c => { if (c.tagName.toLowerCase() !== 'defs') c.remove(); });
}

function txt(x, y, str, opts = {}, parent = stage) {
  const attrs = {
    x, y,
    'text-anchor':       opts.anchor   || 'start',
    'dominant-baseline': opts.baseline || 'auto',
    fill:                opts.fill     || C.ink2,
  };
  if (opts.cls)      attrs.class = opts.cls;
  if (opts.font)     attrs['font-family'] = opts.font;
  if (opts.size)     attrs['font-size']   = opts.size;
  if (opts.italic)   attrs['font-style']  = 'italic';
  if (opts.weight)   attrs['font-weight'] = opts.weight;
  if (opts.tracking) attrs['letter-spacing'] = opts.tracking;
  const t = svg('text', attrs, parent);
  t.textContent = str;
  return t;
}

function line(x1, y1, x2, y2, opts = {}, parent = stage) {
  const cls = opts.arrow ? `arrow${opts.arrow !== 'on' ? ' ' + opts.arrow : ''}` : '';
  return svg('line', {
    x1, y1, x2, y2,
    stroke: opts.stroke || C.line2,
    'stroke-width': opts.w || 1,
    'stroke-dasharray': opts.dash || 'none',
    'marker-end': opts.arrow ? 'url(#arrow)' : '',
    class: cls,
    opacity: opts.opacity ?? 1,
  }, parent);
}

function rect(x, y, w, h, opts = {}, parent = stage) {
  return svg('rect', {
    x, y, width: w, height: h,
    fill: opts.fill || 'none',
    stroke: opts.stroke || C.line2,
    'stroke-width': opts.w || 0.5,
    'stroke-dasharray': opts.dash || 'none',
    rx: opts.rx ?? 0,
    opacity: opts.opacity ?? 1,
  }, parent);
}

function box3d(x, y, w, h, dx, dy, opts = {}, parent = stage) {
  const stroke = opts.stroke || C.ink3;
  const sw = opts.strokeWidth || 1;
  const op = opts.opacity ?? 1;
  const g = svg('g', { opacity: op }, parent);
  svg('path', {
    d: `M ${x + dx} ${y - dy} L ${x + dx + w} ${y - dy} L ${x + dx + w} ${y - dy + h} L ${x + dx} ${y - dy + h} Z`,
    fill: opts.backFill || opts.frontFill || 'none', stroke, 'stroke-width': sw, opacity: 0.4,
  }, g);
  svg('path', {
    d: `M ${x} ${y} L ${x + dx} ${y - dy} L ${x + dx + w} ${y - dy} L ${x + w} ${y} Z`,
    fill: opts.topFill || 'none', stroke, 'stroke-width': sw,
  }, g);
  svg('path', {
    d: `M ${x + w} ${y} L ${x + dx + w} ${y - dy} L ${x + dx + w} ${y - dy + h} L ${x + w} ${y + h} Z`,
    fill: opts.rightFill || 'none', stroke, 'stroke-width': sw,
  }, g);
  svg('path', {
    d: `M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`,
    fill: opts.frontFill || 'none', stroke, 'stroke-width': sw,
  }, g);
  return g;
}

/* ----- chrome slots ------------------------------------------- */

function setMeta(items) {
  const el = $('meta');
  el.innerHTML = '';
  if (!items || !items.length) return;
  items.forEach(it => {
    const wrap = document.createElement('div');
    wrap.className = 'item';
    wrap.innerHTML = `<span class="k">${it.k}:</span><span class="v ${it.tone || ''}">${it.v}</span>`;
    el.appendChild(wrap);
  });
}

function setOverlay(cfg) {
  const el = $('stage-overlay');
  if (!cfg) { el.classList.remove('on'); return; }
  el.classList.add('on');
  $('overlay-label').textContent = cfg.label || '';
  const sl = $('overlay-slider');
  sl.min = cfg.min ?? 1; sl.max = cfg.max ?? 20;
  sl.step = cfg.step ?? 1; sl.value = cfg.value ?? 3;
  $('overlay-val').textContent = sl.value;
  sl.oninput = e => {
    $('overlay-val').textContent = e.target.value;
    if (cfg.onChange) cfg.onChange(+e.target.value);
  };
}

function renderStrip(cells) {
  const el = $('strip');
  el.innerHTML = '';
  if (!cells || !cells.length) return;
  cells.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<div class="heading">${c.heading || ''}</div><div class="body">${c.html || ''}</div>`;
    el.appendChild(cell);
  });
}

/* ===============================================================
   stages — replace with the real sequence for the concept
   =============================================================== */

const stages = [

  {
    short: 'demo',
    cells: [
      { heading: 'concept', html: `<div class="note">A short, plain-language explanation of what the visual shows. Two or three sentences. <strong>Cite the source</strong> if there is one.</div>` },
      { heading: 'formula', html: `<div class="formula">
  <div class="row"><span class="k">input</span><span>x ∈ ℝ</span></div>
  <div class="row"><span class="k">output</span><span>f(x)</span></div>
  <div class="eq">f(x) = a·x + b</div>
</div>` },
      { heading: 'notes',   html: `<div class="note">A direct quote, a precise technical note, or the one thing worth remembering.</div>` },
    ],
    meta: [
      { k: 'source', v: '—' },
      { k: 'live',   v: 'no', tone: 'accent' },
    ],
    setup() {
      const cx = VW / 2;

      /* editorial header — centered */
      txt(cx, 42,  'step 01 · demo',                                  { cls: 'label eyebrow', anchor: 'middle' });
      txt(cx, 74,  'Showing the helpers in use',                      { cls: 'label title',   anchor: 'middle' });
      txt(cx, 100, 'replace this with a real visual for the concept', { cls: 'label body',    anchor: 'middle' });

      /* centered box */
      const bw = 220, bh = 110;
      const bx = cx - bw / 2;
      const by = VH * 0.40;
      rect(bx, by, bw, bh, { stroke: C.ink3, w: 1, rx: 6 });
      txt(cx, by + bh / 2 + 4, 'box', { anchor: 'middle', size: 12, fill: C.ink2 });

      /* callout: label anchors the arrow; arrowhead lands just below the box */
      const headY  = by + bh + 8;   /* arrow head — 8px below the box edge */
      const tailY  = by + bh + 56;  /* arrow tail — 48px arrow length      */
      const labelY = by + bh + 72;  /* label baseline — sits just under tail */
      line(cx, tailY, cx, headY, { stroke: C.accent, w: 1, arrow: 'on' });
      txt(cx, labelY, 'pointing here', { anchor: 'middle', size: 10, fill: C.accent });
    },
    /* tick(t) {}        — define to animate; receives elapsed seconds, runs in rAF until stage change
       overlay: { ... }  — define to show the slider; { label, min, max, value, step, onChange }
       cleanup() {}      — define for any teardown beyond the auto-stop tick                          */
  },

];

/* ===============================================================
   render loop
   =============================================================== */

let current = 0;
let rafId = null;
let tickStart = 0;

function stopTick() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
function startTick(fn) {
  tickStart = performance.now();
  const step = (now) => { fn((now - tickStart) / 1000); rafId = requestAnimationFrame(step); };
  rafId = requestAnimationFrame(step);
}

function buildSteps() {
  const stepsEl = $('steps');
  stepsEl.innerHTML = '';
  stages.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'stepbtn';
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>${s.short}`;
    b.onclick = () => render(i);
    stepsEl.appendChild(b);
  });
  $('step-total').textContent = stages.length;
}

function render(idx) {
  const prev = stages[current];
  if (prev && prev.cleanup) try { prev.cleanup(); } catch (e) { console.error(e); }
  stopTick();

  current = idx;
  const s = stages[idx];

  $('step-num').textContent = idx + 1;
  document.querySelectorAll('.stepbtn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
    b.classList.toggle('passed', i < idx);
  });

  clearStage();
  setMeta(s.meta || []);
  setOverlay(s.overlay || null);
  renderStrip(s.cells);

  if (s.setup) s.setup();
  if (s.tick)  startTick(s.tick);

  $('prev-btn').disabled = idx === 0;
  $('next-btn').disabled = idx === stages.length - 1;
}

buildSteps();
$('prev-btn').onclick = () => current > 0                 && render(current - 1);
$('next-btn').onclick = () => current < stages.length - 1 && render(current + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft'  && current > 0)                  render(current - 1);
  if (e.key === 'ArrowRight' && current < stages.length - 1)  render(current + 1);
});

const ro = new ResizeObserver(() => {
  fitStage();
  if (stages.length) render(current);
});
ro.observe($('stage-wrap'));

requestAnimationFrame(() => requestAnimationFrame(() => {
  fitStage();
  render(0);
}));
</script>

</body>
</html>
