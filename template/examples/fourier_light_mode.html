
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fourier Series · cs · hh-concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  canvas { display: block; background: #f7f6f2; }
  #wrap { position: relative; width: 100%; }
  #ui {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.85);
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 40px;
    padding: 8px 18px;
    backdrop-filter: blur(4px);
  }
  #ui label { color: #888; font-size: 11px; letter-spacing: 0.07em; font-family: 'Courier New', monospace; }
  #ui input[type=range] {
    -webkit-appearance: none;
    width: 90px; height: 2px;
    background: #ddd;
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }
  #ui input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #534AB7;
    cursor: pointer;
  }
  #nval { color: #534AB7; font-size: 12px; font-family: 'Courier New', monospace; min-width: 16px; }
  #label {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="label">Fourier series — square wave</div>
  <div id="ui">
    <label>harmonics</label>
    <input type="range" id="slider" min="1" max="15" value="3" step="1">
    <span id="nval">3</span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const slider = document.getElementById('slider');
const nvalEl = document.getElementById('nval');

let W, H, cx, cy;

function resize() {
  W = wrap.clientWidth || 680;
  H = Math.round(W * 0.52);
  canvas.width = W;
  canvas.height = H;
  cx = Math.round(W * 0.30);
  cy = Math.round(H * 0.5);
}
resize();

let N = 3;
slider.addEventListener('input', () => {
  N = +slider.value;
  nvalEl.textContent = N;
  path.length = 0;
});

let t = 0;
const path = [];
const speed = 0.013;

const PURPLE = '#534AB7';
const TEAL = '#0F6E56';
const GRID = '#e8e6e0';
const AXIS = '#ccc';

function frame() {
  requestAnimationFrame(frame);

  ctx.fillStyle = '#f7f6f2';
  ctx.fillRect(0, 0, W, H);

  const baseR = Math.min(H * 0.19, 72);
  const graphX = cx + baseR * 1.7 + 36;

  ctx.save();
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(graphX, cy - baseR * 1.5);
  ctx.lineTo(graphX, cy + baseR * 1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - baseR * 1.2, cy);
  ctx.lineTo(cx + baseR * 1.2, cy);
  ctx.stroke();
  ctx.restore();

  let x = cx, y = cy;

  for (let i = 1; i <= N; i++) {
    const freq = 2 * i - 1;
    const amp = baseR * (4 / (Math.PI * freq));
    const nx = x + amp * Math.cos(freq * t);
    const ny = y + amp * Math.sin(freq * t);

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, amp, 0, Math.PI * 2);
    ctx.strokeStyle = PURPLE;
    ctx.globalAlpha = 0.13 + 0.04 / i;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.strokeStyle = PURPLE;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(nx, ny, i === N ? 3.5 : 2, 0, Math.PI * 2);
    ctx.fillStyle = i === N ? PURPLE : '#AFA9EC';
    ctx.globalAlpha = 1;
    ctx.fill();
    ctx.restore();

    x = nx; y = ny;
  }

  const maxPath = Math.round((Math.PI * 2) / speed) + 4;
  path.unshift({ y });
  if (path.length > maxPath) path.length = maxPath;

  ctx.save();
  ctx.strokeStyle = TEAL;
  ctx.globalAlpha = 0.22;
  ctx.lineWidth = 0.8;
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(graphX, y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  if (path.length > 1) {
    for (let i = 0; i < path.length - 1; i++) {
      const alpha = (1 - i / path.length) * 0.85;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = TEAL;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(graphX + i, path[i].y);
      ctx.lineTo(graphX + i + 1, path[i + 1].y);
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.fillStyle = '#999';
  ctx.font = '10px Courier New';
  ctx.fillText('n = ' + Array.from({length: N}, (_, i) => 2*i+1).join(', '), cx - 18, H - 46);
  ctx.restore();

  t += speed;
}

frame();
</script>
</body>
</html>
